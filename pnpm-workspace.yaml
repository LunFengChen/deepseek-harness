  '@deepseek-ai/dsh-host-webserver': 'npm:@x1a0f3n9/dsh-host-webserver@workspace:*'
  '@deepseek-ai/dsh-invariants': 'npm:@x1a0f3n9/dsh-invariants@workspace:*'
  '@deepseek-ai/dsh-llm': 'npm:@x1a0f3n9/dsh-llm@workspace:*'
  '@deepseek-ai/dsh-subagent': 'npm:@x1a0f3n9/dsh-subagent@workspace:*'
  '@deepseek-ai/dsh-tools': 'npm:@x1a0f3n9/dsh-tools@workspace:*'
  '@deepseek-ai/dsh-skill': 'npm:@x1a0f3n9/dsh-skill@workspace:*'
