  '@deepseek-ai/dsh-api-session-controller': 'npm:@x1a0f3n9/dsh-api-session-controller@workspace:*'
  '@deepseek-ai/dsh-attachment': 'npm:@x1a0f3n9/dsh-attachment@workspace:*'
  '@deepseek-ai/dsh-client-ui-chat': 'npm:@x1a0f3n9/dsh-client-ui-chat@workspace:*'
