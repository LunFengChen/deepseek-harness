- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- insert:
    - id: mcp-pagination-cycle
      name: '@x1a0f3n9/dsh-mcp-client'
      config:
        transport: stdio
        serverName: pagination-cycle
        command: !!js process.execPath
        args: !!js '[process.env.DSH_MCP_PAGINATION_FIXTURE]'
        failOnStartupError: true
        reconnect:
          enabled: false
