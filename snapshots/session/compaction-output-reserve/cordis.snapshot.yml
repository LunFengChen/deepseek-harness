# With 1,800 tokens of headroom, a 1,000-token output reservation lowers the
# trigger from 6,582 to 5,582, between the history and its condensed replacement.

- id: llm-deepseek
  name: '@x1a0f3n9/dsh-llm-deepseek-api-key'
  disabled: true

- id: session-persistence-jsonl
  name: '@x1a0f3n9/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: compaction-basic
  name: '@x1a0f3n9/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    headroomTokens: 1800
    retainTokens: 20
    maxTokens: 32

- insert:
    - id: llm-replay
      name: '@x1a0f3n9/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 8382
                defaultMaxTokens: 1000
