- id: llm-deepseek
  name: '@x1a0f3n9/dsh-llm-deepseek-api-key'
  disabled: true

- insert:
    - id: llm-replay
      name: '@x1a0f3n9/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-flash
                inputModalities: [text, image]
                contextWindow: 1000000

- id: compaction-basic
  config:
    thresholdRatio: 0.001
    headroomTokens: 256
    retainTokens: 64
    maxTokens: 256
